<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunshower — Review</title>
  <link rel="stylesheet" href="style.css?v=1">
  <style>
    body { padding: 24px; max-width: 640px; margin: 0 auto; font-family: inherit; background: var(--canvas); color: var(--ink); }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .rev-token { display: flex; gap: 8px; margin: 16px 0; }
    .rev-token input { flex: 1; font-family: inherit; font-size: 14px; padding: 10px; border: 1px solid var(--hairline); border-radius: 6px; background: var(--surface); }
    .rev-token button { font-family: inherit; font-size: 14px; padding: 10px 16px; border-radius: 6px; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; }
    .rev-item { background: var(--surface); border: 1px solid var(--hairline); border-radius: 6px; padding: 16px; margin-bottom: 16px; }
    .rev-meta { display: flex; justify-content: space-between; color: var(--stone); font-size: 13px; margin-bottom: 8px; }
    .rev-monteur { font-weight: bold; color: var(--ink); }
    .rev-status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .rev-status.nieuw { background: var(--ember); color: #fff; }
    .rev-status.verwerkt { background: var(--sage-wash); color: var(--sage); }
    .rev-transcript { background: var(--fill-tertiary); border-radius: 6px; padding: 10px; margin-top: 10px; font-size: 15px; line-height: 1.4; }
    .rev-edit { width: 100%; min-height: 60px; font-family: inherit; font-size: 15px; line-height: 1.4; padding: 10px; border: 1px solid var(--hairline); border-radius: 6px; background: var(--surface); resize: vertical; margin-top: 6px; }
    .rev-struct { width: 100%; min-height: 90px; font-family: inherit; font-size: 14px; line-height: 1.4; padding: 10px; border: 1px dashed var(--hairline); border-radius: 6px; background: var(--fill-tertiary); resize: vertical; margin-top: 6px; color: var(--ink); }
    .rev-issue { border: 1px solid var(--hairline); border-radius: 6px; padding: 10px; margin-top: 8px; background: var(--surface); }
    .rev-issue-title { font-size: 12px; color: var(--stone); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; font-weight: bold; }
    .rev-issue label { display: block; font-size: 12px; color: var(--stone); margin-top: 6px; }
    .rev-issue input, .rev-issue textarea { width: 100%; font-family: inherit; font-size: 14px; line-height: 1.4; padding: 8px; border: 1px solid var(--hairline); border-radius: 6px; background: var(--fill-tertiary); margin-top: 3px; box-sizing: border-box; }
    .rev-issue textarea { min-height: 40px; resize: vertical; }
    .rev-actions { margin-top: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .rev-actions .rev-label { margin-top: 0; }
    .rev-doel { font-family: inherit; font-size: 13px; padding: 8px 10px; border: 1px solid var(--hairline); border-radius: 6px; background: var(--surface); color: var(--ink); }
    .rev-approve { font-family: inherit; font-size: 14px; padding: 10px 16px; border-radius: 6px; border: 1px solid var(--sage); background: var(--sage); color: #fff; font-weight: bold; cursor: pointer; }
    .rev-approve:disabled { opacity: 0.5; cursor: wait; }
    .rev-label { font-size: 12px; color: var(--stone); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 12px; }
    .rev-empty { color: var(--stone); text-align: center; padding: 40px; }
    audio { width: 100%; margin-top: 8px; }
    .rev-msg { margin-top: 8px; color: var(--ember); font-size: 13px; }
  </style>
</head>
<body>
  <h1>Inzendingen</h1>
  <p style="color:var(--stone);font-size:13px">Originele audio + lokaal getranscribeerd op je Mac.</p>

  <div class="rev-token">
    <input id="token" type="password" placeholder="Admin token" autocomplete="off">
    <button id="btn-load">Laden</button>
  </div>

  <div id="list"><p class="rev-empty">Voer je token in en druk op Laden.</p></div>

  <script>
    (function () {
      var list = document.getElementById("list");
      var tokenInput = document.getElementById("token");
      var API = "https://spraakbericht.vercel.app";
      var STORE_KEY = "ss_review_token";
      var DIAGNOSE_API = "https://sunshower-diagnose.vercel.app";

      /* Doel-boeken voor de diagnose-app (P4, 2026-08-25).
         'wachtkamer' en 'sunshower' staan ALTIJD in de lijst; 'sunshower' is
         echter geblokkeerd als doel (harde grens — nooit als bestemming). */
      var BOEKEN = ["wachtkamer", "sunshower"];

      function laadBoeken() {
        return fetch(DIAGNOSE_API + "/api/boeken")
          .then(function (r) { return r.json(); })
          .then(function (d) {
            var arr = d && d.boeken ? d.boeken : (Array.isArray(d) ? d : []);
            if (!Array.isArray(arr)) return;
            arr.forEach(function (x) {
              var id = (typeof x === "string") ? x : (x && (x.id || x.slug || x.naam));
              if (id && BOEKEN.indexOf(id) === -1) BOEKEN.push(id);
            });
          })
          .catch(function () { /* offline: alleen defaults zijn voldoende */ });
      }

      function boekenOpties() {
        var h = "";
        BOEKEN.forEach(function (b) {
          if (b === "sunshower") h += '<option value="sunshower" disabled>sunshower (geblokkeerd)</option>';
          else h += '<option value="' + esc(b) + '"' + (b === "wachtkamer" ? " selected" : "") + '>' + esc(b) + '</option>';
        });
        return h;
      }

      // onthoud token (localStorage, alleen op dit apparaat)
      var saved = localStorage.getItem(STORE_KEY);
      if (saved) tokenInput.value = saved;

      // haal de doel-boeken alvast op vóór Patrick 'Laden' drukt (P4)
      laadBoeken();

      function esc(s) {
        var d = document.createElement("div");
        d.textContent = s == null ? "" : String(s);
        return d.innerHTML;
      }

      function fetchUitzendingen(token) {
        return fetch(API + "/api/spraakbericht", {
          headers: { "Authorization": "Bearer " + token }
        }).then(function (r) {
          if (r.status === 401) throw new Error("Onjuist admin-token (401)");
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        });
      }

      function render(items) {
        if (!items || !items.length) {
          list.innerHTML = '<p class="rev-empty">Nog geen inzendingen. Monteurs kunnen via de app een spraakmemo insturen.</p>';
          return;
        }
        list.innerHTML = "";
        items.forEach(function (it) {
          var div = document.createElement("div");
          div.className = "rev-item";
          var audioHtml = it.heeftAudio
            ? '<audio controls src="' + esc(API + "/api/spraakbericht/" + it.id + "/audio?token=" + encodeURIComponent(tokenInput.value)) + '"></audio>'
            : '<span class="rev-label">geen audio</span>';
          var statusClass = it.status === "verwerkt" || it.status === "goedgekeurd" ? "verwerkt" : "nieuw";
          var statusTxt = it.status === "goedgekeurd" ? "goedgekeurd" : (it.status === "verwerkt" ? "verwerkt" : "nieuw");
          var transHtml = it.transcript
            ? '<textarea class="rev-edit" data-id="' + esc(it.id) + '">' + esc(it.transcript) + '</textarea>'
            : '<textarea class="rev-edit" data-id="' + esc(it.id) + '" placeholder="Nog geen transcript — typ het of wacht op de Mac-consumer"></textarea>';
          var diagnoseInfo = it.diagnoseStatus ? '<div class="rev-label">Doorsturen naar diagnose-app: ' + esc(it.diagnoseStatus) + (it.diagnoseTreeId ? ' (boom ' + esc(it.diagnoseTreeId) + ')' : '') + '</div>' : "";
          /* 2026-08-25 (stap 4b): losse issues als aparte bewerkbare blokken.
             Als er meerdere symptomen in één memo zitten, toont Patrick ze zo
             per issue, elk met eigen Model/Symptoom/Analyse/Fix/Controle. */
          var issuesHtml = "";
          if (it.issues && it.issues.length) {
            var blocks = it.issues.map(function (iss, idx) {
              var velden = [["model", "Model"], ["symptoom", "Symptoom"], ["analyse", "Analyse"], ["fix", "Fix"], ["controle", "Controle"]];
              var veldHtml = velden.map(function (v) {
                var key = v[0], lbl = v[1];
                var waarde = iss && iss[key] ? iss[key] : "";
                var isGroot = (key === "analyse" || key === "fix" || key === "controle");
                var tag = isGroot ? "textarea" : "input";
                return '<label>' + lbl + '</label><' + tag + ' data-issue-field="' + key + '">' + esc(waarde) + '</' + tag + '>';
              }).join("");
              return '<div class="rev-issue" data-id="' + esc(it.id) + '">' +
                '<div class="rev-issue-title">Issue ' + (idx + 1) + '</div>' + veldHtml + '</div>';
            }).join("");
            issuesHtml = '<div class="rev-label">Issues (AI-voorstel: per symptoom Model→Symptoom→Analyse→Fix→Controle, bewerkbaar — elk issue wordt apart doorgestuurd)</div>' + blocks;
          } else {
            issuesHtml = it.structuur
              ? '<div class="rev-label">Structuur (AI-voorstel: Model→Symptoom→Analyse→Fix→Controle, bewerkbaar)</div>' +
                '<textarea class="rev-struct" data-id="' + esc(it.id) + '">' + esc(it.structuur) + '</textarea>'
              : '<div class="rev-label">Structuur (nog geen AI-voorstel)</div>' +
                '<textarea class="rev-struct" data-id="' + esc(it.id) + '" placeholder="Het AI-voorstel verschijnt hier na transcriptie. Je kunt het zelf invullen vóór goedkeuren."></textarea>';
          }
          div.innerHTML =
            '<div class="rev-meta">' +
              '<span class="rev-monteur">' + esc(it.monteur) + '</span>' +
              '<span><span class="rev-status ' + statusClass + '">' + statusTxt + '</span> &nbsp; ' + esc(new Date(it.ts).toLocaleString("nl-NL")) + '</span>' +
            '</div>' +
            audioHtml +
            '<div class="rev-label">Transcript (bewerkbaar)</div>' +
            transHtml +
            issuesHtml +
            (it.tekst ? '<div class="rev-label">Aantekening</div><div>' + esc(it.tekst) + '</div>' : "") +
            diagnoseInfo +
            '<div class="rev-actions"><span class="rev-label">Naar boek:</span>' +
              '<select class="rev-doel" data-id="' + esc(it.id) + '">' + boekenOpties() + '</select>' +
              '<button class="rev-approve" data-id="' + esc(it.id) + '">✓ Goedkeuren &amp; doorsturen</button></div>';
          list.appendChild(div);
        });
      }

      document.getElementById("btn-load").addEventListener("click", function () {
        var token = tokenInput.value.trim();
        if (!token) { list.innerHTML = '<p class="rev-empty">Voer je admin-token in.</p>'; return; }
        localStorage.setItem(STORE_KEY, token);
        list.innerHTML = '<p class="rev-empty">Laden…</p>';
        laadBoeken().then(function () { return fetchUitzendingen(token); })
          .then(function (d) { render(d.spraakberichten); })
          .catch(function (e) { list.innerHTML = '<p class="rev-empty">Fout: ' + esc(e.message) + '</p>'; });
      });

      // Goedkeuren + doorsturen (event delegation op de lijst)
      list.addEventListener("click", function (ev) {
        var btn = ev.target.closest(".rev-approve");
        if (!btn) return;
        var id = btn.getAttribute("data-id");
        var ta = list.querySelector('textarea[data-id="' + id + '"]');
        var st = list.querySelector('.rev-struct[data-id="' + id + '"]');
        var sel = list.querySelector('.rev-doel[data-id="' + id + '"]');
        var transcript = ta ? ta.value.trim() : "";
        var structuur = st ? st.value.trim() : "";
        var doelBoek = sel ? sel.value : "wachtkamer";
        /* 2026-08-25 (stap 4b): verzamel de bewerkte losse issues (indien aanwezig). */
        var issues = [];
        list.querySelectorAll('.rev-issue[data-id="' + id + '"]').forEach(function (blok) {
          var iss = {};
          blok.querySelectorAll("[data-issue-field]").forEach(function (f) {
            iss[f.getAttribute("data-issue-field")] = f.value.trim();
          });
          issues.push(iss);
        });
        if (!transcript) { btn.textContent = "Vul transcript in eerst"; return; }
        /* harde grens: sunshower mag nooit het doel-boek zijn (ook al is de
           optie in de dropdown uitgeschakeld, defensief nogmaals blokkeren). */
        if (doelBoek === "sunshower") { btn.textContent = "sunshower is geblokkeerd als doel"; return; }
        var token = tokenInput.value.trim();
        if (!token) { btn.textContent = "Geen token"; return; }
        btn.disabled = true;
        var orig = btn.textContent;
        btn.textContent = "Bezig…";
        var bodyObj = { transcript: transcript, doelBoek: doelBoek };
        if (issues.length) bodyObj.issues = issues;
        else if (structuur) bodyObj.structuur = structuur;
        fetch(API + "/api/spraakbericht/" + id + "/approve", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify(bodyObj)
        }).then(function (r) { return r.json(); }).then(function (d) {
          if (d.ok) {
            btn.textContent = "✓ Doorgestuurd";
            btn.style.opacity = "0.6";
            // toon diagnose-resultaat (bij meerdere issues: array van per-issue resultaten)
            var res = d.diagnoseResult;
            var info = "Doorgestuurd";
            if (Array.isArray(res)) {
              var okN = res.filter(function (x) { return x && x.status === 200; }).length;
              var totaal = res.length;
              info = totaal + " issues doorgestuurd (" + okN + " ok)";
            } else if (res && res.status && res.status !== 200) info += " (diagnose: HTTP " + res.status + ")";
            else if (res && res.status === 0) info += " (diagnose-fout)";
            var label = document.createElement("div");
            label.className = "rev-label";
            label.textContent = "Doorsturen: " + info;
            btn.closest(".rev-item").appendChild(label);
          } else {
            btn.textContent = "Fout: " + (d.error || "onbekend");
            btn.disabled = false;
          }
        }).catch(function (e) {
          btn.textContent = "Fout: " + e.message;
          btn.disabled = false;
        });
      });
    })();
  </script>
</body>
</html>
